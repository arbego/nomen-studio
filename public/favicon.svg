<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!--
    The studio's mark, padded into a square and on a transparent ground.

    The letter follows the operating system's light or dark setting rather than
    the studio's own theme toggle: a favicon is drawn by the browser, which
    knows nothing about what the page has been switched to. The inlay keeps the
    accent either way, which is what makes it recognisable at 16 pixels when
    the letter itself is barely a shape.
  -->
  <style>
    .letter { fill: #2b2b2b; }
    @media (prefers-color-scheme: dark) {
      .letter { fill: #f7f5f2; }
    }
  </style>
  <g transform="translate(8 10.2) scale(0.08526)">
    <path class="letter" d="M0 0L196 0L391 293L389 82L333 66L333 0L563 0L563 68L512 82L512 511L367 511L173 221L174 430L229 444L229 511L0 511L0 445L51 430L51 82L0 67Z"/>
    <path fill="#ffb86a" d="M88 0L124 0L471 511L435 511Z"/>
  </g>
</svg>
